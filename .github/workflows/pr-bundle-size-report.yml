name: PR Bundle Size Report

# Runs in the context of the base repository, so repository secrets are available even when
# the measurement was triggered by a pull request from a fork. The report artifact is
# untrusted: its site is only uploaded, and the comment is rendered by the scripts of the
# default branch from validated numbers.
on:
  workflow_run:
    workflows: ['PR Bundle Size']
    types:
      - completed

jobs:
  report:
    name: Report
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GRAVITY_UI_APP_ID }}
          private-key: ${{ secrets.GRAVITY_UI_APP_PRIVATE_KEY }}

      # The PR number is resolved from the event instead of being passed through the artifact,
      # because the artifact is controlled by the PR. `workflow_run.pull_requests` is empty for
      # forks, hence the lookup. A run for a commit that is no longer the PR head resolves to
      # nothing, and the remaining steps are skipped.
      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_LABEL: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${HEAD_LABEL}" |
              jq -r --arg sha "${HEAD_SHA}" 'map(select(.head.sha == $sha)) | .[0].number // empty'
          )
          if [ -z "${number}" ]; then
            echo "::notice::No open PR has this commit as its head, skipping."
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
        shell: bash

      # The default branch, for pr-comment.mjs. Checked out before anything from the PR is on disk.
      - name: Checkout
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install AWS CLI
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2.22.35
          arch: amd64

      # Not v4: its bundled extractor is affected by GHSA-6jrj-vc65-c983 (files written outside
      # the target directory), and this archive is untrusted.
      - name: Download Report
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v7
        with:
          name: bundle-size-report
          path: bundle-size-report
          github-token: ${{ steps.generate-token.outputs.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # Each run replaces the previous report of the PR.
      - name: Upload to S3
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORYBOOK_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORYBOOK_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: true
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          aws s3 sync bundle-size-report "s3://playwright-reports/charts/pulls/${PR_NUMBER}/bundle-size/" \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete
        shell: bash

      - name: Build Comment
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          node scripts/bundle-size/pr-comment.mjs \
            --report bundle-size-report/report.json \
            --pr "${PR_NUMBER}" > bundle-size-comment.md
        shell: bash

      - name: Comment on PR (success)
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          number: ${{ steps.pr.outputs.number }}
          header: bundle-size
          path: bundle-size-comment.md

      - name: Comment on PR (measurement failure)
        if: steps.pr.outputs.number && github.event.workflow_run.conclusion == 'failure'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          number: ${{ steps.pr.outputs.number }}
          header: bundle-size
          message: |
            ❌ Bundle size measurement failed. Check the [workflow run](${{ github.event.workflow_run.html_url }}) for details.

      - name: Comment on PR (report failure)
        if: failure() && steps.pr.outputs.number
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          number: ${{ steps.pr.outputs.number }}
          header: bundle-size
          message: |
            ❌ Bundle size report failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
