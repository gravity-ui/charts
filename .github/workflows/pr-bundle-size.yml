name: PR Bundle Size

on:
  pull_request:

permissions:
  contents: read

# A new push to the PR makes the previous measurement obsolete.
concurrency:
  group: pr-bundle-size-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pr-report.mjs walks back from the base branch head to a measured commit.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Build
        run: npm run build
      - name: Measure
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          node scripts/bundle-size/pr-report.mjs
          --out bundle-size-report
          --history https://storage.yandexcloud.net/playwright-reports/charts/bundle-size
          --pr "${PR_NUMBER}"
          --sha "${PR_HEAD_SHA}"
      # Pull requests from forks run without repository secrets, so this workflow only
      # measures. "PR Bundle Size Report" uploads the report to S3 and comments on the PR.
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: bundle-size-report
          if-no-files-found: error
          retention-days: 1
