name: PR Docs Preview

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Docs preview is not needed for dependency bumps.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm run docs:deps

      - name: Build docs
        run: npm run docs:build

      # Pull requests from forks run without repository secrets, so this
      # workflow only builds. The "PR Docs Preview Deploy" workflow picks up
      # the artifact, uploads it to S3 and comments on the PR.
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ./dist-docs
          if-no-files-found: error
          retention-days: 1
