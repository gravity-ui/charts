name: PR Docs Preview

on:
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Docs preview is not needed for dependency bumps.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm run docs:deps

      - name: Build docs
        run: npm run docs:build

      # Pull requests from forks run without repository secrets, so this
      # workflow only builds and tests. The "PR Docs Preview Deploy" workflow picks up
      # the artifact, uploads it to S3 and comments on the PR.
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ./dist-docs
          if-no-files-found: error
          retention-days: 1

  docs_examples:
    name: Docs examples
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Download docs artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-preview
          path: dist-docs

      - name: Test docs examples
        run: npm run test:docs-examples
        env:
          CI: 'true'

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-examples-report
          path: |
            playwright-report-docs
            test-results/docs-examples
          retention-days: 7
