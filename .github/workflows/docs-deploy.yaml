name: Documentation Deploy

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read package version
        id: package
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install docs dependencies
        run: npm run docs:deps
        shell: bash
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run docs:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check npm latest
        id: npm
        env:
          DOCS_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          latest=$(npm view @gravity-ui/charts@latest version --registry=https://registry.npmjs.org --prefer-online)
          if [ "$DOCS_VERSION" = "$latest" ]; then
            echo 'is-latest=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping docs for $DOCS_VERSION. npm latest is $latest."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.npm.outputs.is-latest == 'true'
        uses: actions/deploy-pages@v4
