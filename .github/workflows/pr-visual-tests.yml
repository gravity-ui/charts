name: PR Visual Tests

on:
  pull_request:

jobs:
  visual_tests_shard:
    name: Visual Tests (Shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Run Visual Tests
        run: npm run playwright:visual -- --shard=${{ matrix.shard }}/2 --workers=4 --reporter=list,blob
        env:
          CI: 'true'
      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests-blob-${{ matrix.shard }}
          path: ./blob-report
          if-no-files-found: error
          retention-days: 1

  visual_tests:
    name: Visual Tests
    needs: visual_tests_shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Packages
        run: npm ci
      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: visual-tests-blob-*
          path: ./blob-reports
          merge-multiple: true
      - name: Merge Playwright Reports
        run: npx playwright merge-reports --reporter=html ./blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./playwright-report
          if-no-files-found: error
          retention-days: 1
      - name: Save PR ID
        if: always()
        run: |
          pr="${{ github.event.pull_request.number }}"
          echo $pr > ./pr-id.txt
        shell: bash
      - name: Create PR Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr-id.txt
      - name: Verify Shard Results
        if: always()
        env:
          SHARD_RESULT: ${{ needs.visual_tests_shard.result }}
        run: test "$SHARD_RESULT" = success

  visual_tests_perf:
    name: Visual Tests (Performance)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Run Performance Tests
        run: npm run playwright:perf
        env:
          CI: 'true'
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf
          path: ./playwright-report
          retention-days: 1

  # Validate the edges of the React peer range. Runs only on release-please
  # PRs so regular PR CI stays fast; failure here blocks the release before
  # it can be tagged and published.
  visual_tests_react_17:
    name: Visual Tests (React 17)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Swap React to 17
        run: node scripts/install-react.mjs 17
      - name: Run Visual Tests
        run: npm run playwright:visual
        env:
          CI: 'true'
          REACT_VERSION: '17'
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-react17
          path: ./playwright-report
          retention-days: 1

  visual_tests_perf_react_17:
    name: Visual Tests Performance (React 17)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Swap React to 17
        run: node scripts/install-react.mjs 17
      - name: Run Performance Tests
        run: npm run playwright:perf
        env:
          CI: 'true'
          REACT_VERSION: '17'
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf-react17
          path: ./playwright-report
          retention-days: 1

  visual_tests_react_19:
    name: Visual Tests (React 19)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Swap React to 19
        run: node scripts/install-react.mjs 19
      - name: Run Visual Tests
        run: npm run playwright:visual
        env:
          CI: 'true'
          REACT_VERSION: '19'
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-react19
          path: ./playwright-report
          retention-days: 1

  visual_tests_perf_react_19:
    name: Visual Tests Performance (React 19)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install Packages
        run: npm ci
      - name: Swap React to 19
        run: node scripts/install-react.mjs 19
      - name: Run Performance Tests
        run: npm run playwright:perf
        env:
          CI: 'true'
          REACT_VERSION: '19'
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf-react19
          path: ./playwright-report
          retention-days: 1
